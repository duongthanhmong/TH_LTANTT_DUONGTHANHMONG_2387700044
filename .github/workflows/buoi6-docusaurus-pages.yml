name: BUOI6 Docusaurus Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'BUOI6/lab2/docusaurus-pipeline/**'
      - '.github/workflows/buoi6-docusaurus-pages.yml'

permissions:
  contents: read

jobs:
  build:
    name: build-docusaurus
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BUOI6/lab2/docusaurus-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BUOI6/lab2/docusaurus-pipeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build
          path: BUOI6/lab2/docusaurus-pipeline/build

  deploy:
    name: deploy-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-build
          path: public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
