name: BUOI6 Basic Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'BUOI6/lab1/basic-pipeline/**'
      - '.github/workflows/buoi6-basic-pipeline.yml'

permissions:
  contents: read

jobs:
  build-job:
    name: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Show build message
        run: echo "Hello, ${{ github.actor }}!"

  test-job1:
    name: test-job1
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Run short test
        run: echo "This job tests something"

  test-job2:
    name: test-job2
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Run longer test simulation
        run: |
          echo "This job tests something, but takes more time than test-job1."
          echo "After the echo commands complete, it runs the sleep command for 20 seconds"
          echo "which simulates a test that runs 20 seconds longer than test-job1"
          sleep 20

  deploy-prod:
    name: deploy-prod
    needs: [test-job1, test-job2]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Show deployment message
        run: echo "This job deploys something from the ${{ github.ref_name }} branch."
